<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Ilustración de uva roja">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#fbf4e8"/>
      <stop offset="0.65" stop-color="#f0e2cd"/>
      <stop offset="1" stop-color="#e2cfb2"/>
    </radialGradient>
    <radialGradient id="uva" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#e8a3bd"/>
      <stop offset="0.42" stop-color="#b04a72"/>
      <stop offset="1" stop-color="#5d1f3c"/>
